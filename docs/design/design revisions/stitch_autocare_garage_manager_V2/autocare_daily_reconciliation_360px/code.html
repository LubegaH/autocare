<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Daily Reconciliation - AUTOCARE PRO</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-tint": "#29695b",
                        "on-tertiary-container": "#a5b2ba",
                        "on-error": "#ffffff",
                        "primary-fixed": "#afefdd",
                        "primary": "#00342b",
                        "primary-container": "#004d40",
                        "surface": "#f9f9f9",
                        "on-error-container": "#93000a",
                        "on-primary-fixed-variant": "#065043",
                        "outline": "#707975",
                        "error": "#ba1a1a",
                        "on-primary-container": "#7ebdac",
                        "inverse-primary": "#94d3c1",
                        "secondary-container": "#feaa00",
                        "on-secondary-fixed-variant": "#624000",
                        "surface-container-highest": "#e2e2e2",
                        "border-black": "#000000",
                        "on-secondary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface-variant": "#e2e2e2",
                        "secondary": "#825500",
                        "primary-fixed-dim": "#94d3c1",
                        "secondary-fixed-dim": "#ffb950",
                        "on-primary": "#ffffff",
                        "background": "#f9f9f9",
                        "surface-container": "#eeeeee",
                        "on-primary-fixed": "#00201a",
                        "surface-bright": "#f9f9f9",
                        "tertiary-container": "#39454b",
                        "tertiary-fixed-dim": "#bbc8d0",
                        "on-tertiary-fixed-variant": "#3c494f",
                        "error-container": "#ffdad6",
                        "on-secondary-container": "#684300",
                        "surface-container-lowest": "#ffffff",
                        "inverse-surface": "#2f3131",
                        "on-secondary-fixed": "#291800",
                        "surface-container-high": "#e8e8e8",
                        "surface-dim": "#dadada",
                        "on-background": "#1a1c1c",
                        "outline-variant": "#bfc9c4",
                        "on-surface-variant": "#3f4945",
                        "on-tertiary-fixed": "#111d23",
                        "secondary-fixed": "#ffddb3",
                        "warning-light": "#fff8e1",
                        "tertiary": "#232f35",
                        "tertiary-fixed": "#d7e4ec",
                        "inverse-on-surface": "#f1f1f1",
                        "on-surface": "#1a1c1c",
                        "surface-container-low": "#f3f3f3"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-lg": "24px",
                        "gutter": "16px",
                        "unit": "4px",
                        "margin-mobile": "16px",
                        "stack-sm": "8px",
                        "margin-desktop": "32px",
                        "stack-md": "16px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "label-bold": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "status-number": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "label-bold": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "status-number": ["24px", { "lineHeight": "24px", "fontWeight": "800" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Neo-Brutalist utility classes */
        .neo-border { border: 2px solid #000000; }
        .neo-shadow { box-shadow: 4px 4px 0px #000000; transition: all 0.2s ease; }
        .neo-shadow:active { box-shadow: 0px 0px 0px #000000; transform: translate(4px, 4px); }
        .neo-input:focus { outline: none; border-color: #004d40; background-color: #e2e2e2; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col items-center">
<!-- TopAppBar -->
<header class="bg-background w-full top-0 sticky border-b-2 border-black flex items-center justify-between px-margin-mobile md:px-margin-desktop h-16 z-40 relative">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-container overflow-hidden border border-black">
<img class="w-full h-full object-cover" data-alt="A tightly cropped headshot of an automotive garage manager in a modern industrial setting. The person wears a durable mechanic's uniform in a dark green or black hue. Bright overhead warehouse lighting reflects off subtle metallic textures nearby. Professional, focused mood, high contrast, neo-brutalist aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDx9KDAr_9vqqkWf7h7Ok62bgStvWc8cYOwv7rBRaqirB7Yi0iusxhfq-Cgay1HTeeWchjW_k4242UwSWi5S6PGFrrHtt-UOkFIISDk8QSTNR7kI2VFKRHt6VJsgFf0Re7yS43CryMt8dcSbPTkRz3lz4RsHZFtV19mW4fh8zgsHp_wXXNcYBaOwtS7l_1ynOwtk0aZmn4gz_e8mNbef8cIwyVWxM0jCTEgTOShEqXZ59hFesYEPYQj"/>
</div>
<span class="font-headline-md text-headline-md font-extrabold tracking-tighter text-on-background">AUTOCARE PRO</span>
</div>
<button class="text-primary hover:bg-surface-container active:translate-y-[2px] transition-transform p-2 rounded-none">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-[360px] flex-1 flex flex-col gap-stack-lg p-margin-mobile pb-32">
<!-- Header -->
<div class="flex flex-col gap-unit">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile uppercase tracking-tighter border-b-4 border-black pb-2 inline-block w-fit">Daily Recon</h1>
<p class="font-body-md text-on-surface-variant">Reconcile ending balances.</p>
</div>
<!-- Reconciliation Form Container -->
<form class="flex flex-col gap-stack-md w-full">
<!-- Cash Card -->
<div class="neo-border bg-surface-container p-stack-md flex flex-col gap-stack-sm relative">
<div class="absolute -top-3 -right-3 bg-secondary-container neo-border px-2 py-1 flex items-center justify-center transform rotate-3">
<span class="material-symbols-outlined text-[16px]" data-icon="payments">payments</span>
</div>
<h2 class="font-label-bold text-label-bold uppercase">Cash (UGX)</h2>
<div class="flex flex-col gap-1">
<label class="text-xs font-bold text-on-surface-variant uppercase">Expected</label>
<div class="font-status-number text-status-number bg-surface-container-highest p-2 neo-border">
                        1,450,000
                    </div>
</div>
<div class="flex flex-col gap-1">
<label class="text-xs font-bold uppercase">Counted</label>
<input class="w-full bg-surface p-2 neo-border font-body-lg text-body-lg text-right neo-input rounded-none" placeholder="Enter amount..." required="" type="number"/>
</div>
<div class="flex flex-col gap-1">
<label class="text-xs font-bold text-on-surface-variant uppercase">Variance</label>
<div class="font-status-number text-status-number bg-surface-container-highest p-2 neo-border text-right text-error">
                        -
                    </div>
</div>
<textarea class="w-full bg-surface p-2 neo-border font-body-md text-body-md min-h-[60px] neo-input rounded-none mt-2" placeholder="Notes for Cash..." rows="2"></textarea>
</div>
<!-- MTN MoMo Card -->
<div class="neo-border bg-surface-container p-stack-md flex flex-col gap-stack-sm relative mt-4">
<div class="absolute -top-3 -right-3 bg-secondary-container neo-border px-2 py-1 flex items-center justify-center transform -rotate-2">
<span class="material-symbols-outlined text-[16px]" data-icon="smartphone">smartphone</span>
</div>
<h2 class="font-label-bold text-label-bold uppercase">MTN MoMo</h2>
<div class="flex flex-col gap-1">
<label class="text-xs font-bold text-on-surface-variant uppercase">Expected</label>
<div class="font-status-number text-status-number bg-surface-container-highest p-2 neo-border">
                        850,000
                    </div>
</div>
<div class="flex flex-col gap-1">
<label class="text-xs font-bold uppercase">Confirmed</label>
<input class="w-full bg-surface p-2 neo-border font-body-lg text-body-lg text-right neo-input rounded-none" placeholder="Enter amount..." required="" type="number"/>
</div>
<div class="flex flex-col gap-1">
<label class="text-xs font-bold text-on-surface-variant uppercase">Variance</label>
<div class="font-status-number text-status-number bg-surface-container-highest p-2 neo-border text-right">
                        -
                    </div>
</div>
<textarea class="w-full bg-surface p-2 neo-border font-body-md text-body-md min-h-[60px] neo-input rounded-none mt-2" placeholder="Notes for MTN MoMo..." rows="2"></textarea>
</div>
<!-- Footer Details -->
<div class="mt-stack-md border-t-2 border-black pt-stack-sm flex flex-col gap-1">
<div class="flex justify-between items-center font-label-bold text-label-bold uppercase">
<span>Reconciler:</span>
<span class="bg-tertiary-container text-on-tertiary px-2 py-1 neo-border">Alex J.</span>
</div>
<div class="flex justify-between items-center font-label-bold text-label-bold uppercase">
<span>Time:</span>
<span class="font-mono">18:00 EAT</span>
</div>
<div class="bg-warning-light p-2 neo-border mt-2 flex gap-2 items-start">
<span class="material-symbols-outlined text-secondary" data-icon="info">info</span>
<p class="text-xs font-bold text-secondary uppercase leading-tight">Note: Closing creates an auditable snapshot; corrections require adjustments.</p>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-primary-container text-on-primary-container font-label-bold text-label-bold uppercase py-4 neo-border neo-shadow mt-stack-md" type="button">
                CONFIRM RECONCILIATION
            </button>
</form>
</main>
<!-- BottomNavBar -->
<nav class="bg-background fixed bottom-0 w-full z-50 h-20 border-t-2 border-black flex justify-around items-stretch w-full">
<!-- Home (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-background h-full w-full hover:bg-secondary-fixed-dim active:translate-y-[2px] transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-bold text-label-bold uppercase mt-1">Home</span>
</a>
<!-- Jobs (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-background h-full w-full hover:bg-secondary-fixed-dim active:translate-y-[2px] transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="build">build</span>
<span class="font-label-bold text-label-bold uppercase mt-1">Jobs</span>
</a>
<!-- Finance (Active) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container h-full w-full active:translate-y-[2px] transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="payments" data-weight="fill">payments</span>
<span class="font-label-bold text-label-bold uppercase mt-1">Finance</span>
</a>
<!-- More (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-background h-full w-full hover:bg-secondary-fixed-dim active:translate-y-[2px] transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
<span class="font-label-bold text-label-bold uppercase mt-1">More</span>
</a>
</nav>
</body></html>
