<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Mechanic Job Update</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-tint": "#29695b",
                        "on-tertiary-container": "#a5b2ba",
                        "on-error": "#ffffff",
                        "primary-fixed": "#afefdd",
                        "primary": "#00342b",
                        "primary-container": "#004d40",
                        "surface": "#f9f9f9",
                        "on-error-container": "#93000a",
                        "on-primary-fixed-variant": "#065043",
                        "outline": "#707975",
                        "error": "#ba1a1a",
                        "on-primary-container": "#7ebdac",
                        "inverse-primary": "#94d3c1",
                        "secondary-container": "#feaa00",
                        "on-secondary-fixed-variant": "#624000",
                        "surface-container-highest": "#e2e2e2",
                        "border-black": "#000000",
                        "on-secondary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface-variant": "#e2e2e2",
                        "secondary": "#825500",
                        "primary-fixed-dim": "#94d3c1",
                        "secondary-fixed-dim": "#ffb950",
                        "on-primary": "#ffffff",
                        "background": "#f9f9f9",
                        "surface-container": "#eeeeee",
                        "on-primary-fixed": "#00201a",
                        "surface-bright": "#f9f9f9",
                        "tertiary-container": "#39454b",
                        "tertiary-fixed-dim": "#bbc8d0",
                        "on-tertiary-fixed-variant": "#3c494f",
                        "error-container": "#ffdad6",
                        "on-secondary-container": "#684300",
                        "surface-container-lowest": "#ffffff",
                        "inverse-surface": "#2f3131",
                        "on-secondary-fixed": "#291800",
                        "surface-container-high": "#e8e8e8",
                        "surface-dim": "#dadada",
                        "on-background": "#1a1c1c",
                        "outline-variant": "#bfc9c4",
                        "on-surface-variant": "#3f4945",
                        "on-tertiary-fixed": "#111d23",
                        "secondary-fixed": "#ffddb3",
                        "warning-light": "#fff8e1",
                        "tertiary": "#232f35",
                        "tertiary-fixed": "#d7e4ec",
                        "inverse-on-surface": "#f1f1f1",
                        "on-surface": "#1a1c1c",
                        "surface-container-low": "#f3f3f3"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-lg": "24px",
                        "gutter": "16px",
                        "unit": "4px",
                        "margin-mobile": "16px",
                        "stack-sm": "8px",
                        "margin-desktop": "32px",
                        "stack-md": "16px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "label-bold": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "status-number": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "label-bold": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "status-number": ["24px", { "lineHeight": "24px", "fontWeight": "800" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            -webkit-tap-highlight-color: transparent;
        }
        
        .neo-btn {
            border: 2px solid theme('colors.border-black');
            transition: transform 0.1s ease;
        }
        
        .neo-btn:active {
            transform: translateY(2px);
        }

        .neo-card {
            border: 2px solid theme('colors.border-black');
        }
        
        /* Suppress bottom nav safe zone when nav is hidden */
        .pb-safe-nav { padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<!-- TopAppBar Semantic Shell (Suppressed Nav, only Header) -->
<header class="bg-background text-primary w-full top-0 sticky border-b-2 border-black flat no shadows flex flex-col justify-center px-margin-mobile md:px-margin-desktop h-16 z-40">
<div class="flex items-center gap-4">
<button class="flex items-center gap-2 hover:bg-surface-container active:translate-y-[2px] transition-transform p-1 -ml-1">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_back</span>
<span class="font-label-bold text-label-bold uppercase text-on-surface-variant">BACK TO MY WORK</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-margin-mobile md:px-margin-desktop py-stack-lg max-w-7xl mx-auto w-full pb-[120px]">
<!-- Job Header -->
<div class="mb-stack-lg">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg uppercase text-on-background mb-unit tracking-tighter">Toyota Hilux</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant uppercase">UBA 123X • STANDARD SERVICE</p>
</div>
<!-- Status Card -->
<div class="neo-card bg-surface-container p-stack-md mb-stack-lg relative overflow-hidden group">
<div class="absolute top-0 right-0 w-16 h-16 bg-secondary-container border-l-2 border-b-2 border-border-black flex items-center justify-center">
<span class="material-symbols-outlined text-on-secondary-container" style="font-variation-settings: 'FILL' 1;">build</span>
</div>
<p class="font-label-bold text-label-bold uppercase text-on-surface-variant mb-unit">Current Status</p>
<div class="flex items-baseline gap-2">
<span class="font-display-lg text-display-lg text-primary tracking-tighter">IN PROGRESS</span>
<span class="font-headline-md text-headline-md text-on-surface-variant">(45 MIN)</span>
</div>
<!-- Timeline Indicator -->
<div class="mt-stack-lg flex items-center w-full">
<div class="h-6 w-6 border-2 border-border-black bg-primary flex items-center justify-center rounded-none z-10">
<span class="material-symbols-outlined text-[14px] text-on-primary" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<div class="h-0.5 bg-border-black flex-1 -mx-0.5"></div>
<div class="h-6 w-6 border-2 border-border-black bg-secondary-container flex items-center justify-center rounded-none z-10">
<span class="material-symbols-outlined text-[14px] text-on-secondary-container" style="font-variation-settings: 'FILL' 1;">more_horiz</span>
</div>
<div class="h-0.5 bg-outline flex-1 -mx-0.5"></div>
<div class="h-6 w-6 border-2 border-outline bg-surface flex items-center justify-center rounded-none z-10"></div>
</div>
</div>
<!-- Bento Grid Actions -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter mb-stack-lg">
<!-- Add Finding Action -->
<button class="neo-btn bg-background p-stack-md text-left flex flex-col justify-between h-32 w-full hover:bg-surface-container focus:outline-none">
<div class="flex justify-between items-start w-full">
<span class="font-label-bold text-label-bold uppercase text-on-background">Log Issue</span>
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</div>
<span class="font-headline-md text-headline-md text-on-background uppercase mt-auto">ADD FINDING</span>
</button>
<!-- Parts Used Action -->
<button class="neo-btn bg-background p-stack-md text-left flex flex-col justify-between h-32 w-full hover:bg-surface-container focus:outline-none">
<div class="flex justify-between items-start w-full">
<span class="font-label-bold text-label-bold uppercase text-on-background">Inventory</span>
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">handyman</span>
</div>
<span class="font-headline-md text-headline-md text-on-background uppercase mt-auto">PARTS USED</span>
</button>
</div>
</main>
<!-- Fixed Bottom Action Area (Task specific, overlays canvas bottom) -->
<div class="fixed bottom-0 left-0 w-full bg-background border-t-2 border-border-black p-margin-mobile md:px-margin-desktop md:py-stack-md z-50 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
<div class="max-w-7xl mx-auto flex gap-4">
<button class="neo-btn flex-1 bg-primary-container text-on-primary-container py-4 flex items-center justify-center gap-2 focus:outline-none">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">task_alt</span>
<span class="font-headline-md text-headline-md uppercase">MARK AS COMPLETE</span>
</button>
</div>
</div>
<!-- BottomNavBar Semantic Shell (Suppressed on Task-Focused screen) -->
<!-- Navigation is intentionally omitted here as per semantic rules: "Any sub-page featuring a 'Close' or 'Back' action implies a temporary departure from the main navigation flow." -->
</body></html>
