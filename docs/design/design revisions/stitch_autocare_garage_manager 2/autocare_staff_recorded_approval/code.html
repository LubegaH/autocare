<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AutoCare - Staff-Recorded Decision</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed": "#afefdd",
                        "surface-container-highest": "#e2e2e2",
                        "on-secondary-fixed-variant": "#624000",
                        "tertiary-fixed": "#d7e4ec",
                        "primary-fixed-dim": "#94d3c1",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed": "#ffddb3",
                        "secondary": "#825500",
                        "outline-variant": "#bfc9c4",
                        "on-surface-variant": "#3f4945",
                        "inverse-on-surface": "#f1f1f1",
                        "on-primary-container": "#7ebdac",
                        "surface": "#f9f9f9",
                        "inverse-surface": "#2f3131",
                        "on-error": "#ffffff",
                        "outline": "#707975",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "secondary-container": "#feaa00",
                        "surface-container-low": "#f3f3f3",
                        "secondary-fixed-dim": "#ffb950",
                        "error": "#ba1a1a",
                        "primary-container": "#004d40",
                        "surface-bright": "#f9f9f9",
                        "tertiary-container": "#39454b",
                        "tertiary-fixed-dim": "#bbc8d0",
                        "on-primary-fixed": "#00201a",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed": "#291800",
                        "primary": "#00342b",
                        "on-secondary-container": "#684300",
                        "on-primary-fixed-variant": "#065043",
                        "surface-variant": "#e2e2e2",
                        "on-tertiary-fixed": "#111d23",
                        "background": "#f9f9f9",
                        "on-tertiary-container": "#a5b2ba",
                        "tertiary": "#232f35",
                        "inverse-primary": "#94d3c1",
                        "border-black": "#000000",
                        "on-secondary": "#ffffff",
                        "surface-dim": "#dadada",
                        "on-background": "#1a1c1c",
                        "on-surface": "#1a1c1c",
                        "surface-container": "#eeeeee",
                        "surface-tint": "#29695b",
                        "surface-container-high": "#e8e8e8",
                        "on-error-container": "#93000a",
                        "warning-light": "#fff8e1",
                        "on-tertiary-fixed-variant": "#3c494f"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "margin-desktop": "32px",
                        "gutter": "16px",
                        "stack-sm": "8px",
                        "unit": "4px",
                        "stack-md": "16px",
                        "stack-lg": "24px"
                    },
                    "fontFamily": {
                        "label-bold": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "status-number": ["Inter"],
                        "headline-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"]
                    },
                    "fontSize": {
                        "label-bold": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "status-number": ["24px", { "lineHeight": "24px", "fontWeight": "800" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Neo-Brutalist Active State Translation */
        .btn-active:active {
            transform: translateY(2px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col md:max-w-7xl md:mx-auto pb-24 md:pb-0">
<!-- TopAppBar -->
<header class="bg-background dark:bg-background text-primary dark:text-primary-fixed w-full top-0 sticky border-b-2 border-black dark:border-white flex justify-between items-center px-margin-mobile h-16 z-40">
<div class="flex items-center gap-4">
<span class="font-label-bold text-label-bold uppercase">Garage Manager</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-black uppercase text-primary dark:text-primary-fixed">AUTOCARE PRO</h1>
<button class="hover:bg-surface-container dark:hover:bg-surface-container-highest active:translate-y-0.5 transition-transform p-2 border-2 border-transparent">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<!-- Main Content Canvas - Transactional Intent (No Shell nav needed logically, but standard requests Bottom Nav on mobile) -->
<main class="flex-grow p-margin-mobile md:p-margin-desktop grid grid-cols-1 gap-stack-lg">
<!-- Header Section -->
<section class="flex flex-col gap-stack-sm border-b-2 border-black pb-stack-md">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg uppercase">Record Decision</h2>
<p class="font-body-md text-on-surface-variant">Log an offline customer approval or rejection.</p>
</section>
<!-- Form Area (Bento-style layout on desktop) -->
<form class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
<!-- Metadata Card -->
<div class="bg-surface-container border-2 border-black p-stack-md flex flex-col gap-stack-md">
<div class="flex justify-between items-center border-b-2 border-black pb-stack-sm">
<span class="font-label-bold text-label-bold uppercase">Revision</span>
<span class="font-status-number text-status-number">#3</span>
</div>
<div class="grid grid-cols-2 gap-stack-sm">
<div class="flex flex-col">
<label class="font-label-bold text-label-bold uppercase text-on-surface-variant">Recorder</label>
<span class="font-body-lg text-body-lg font-bold">Alex Jenkins</span>
</div>
<div class="flex flex-col">
<label class="font-label-bold text-label-bold uppercase text-on-surface-variant">Time</label>
<span class="font-body-lg text-body-lg font-bold">14:32 EST</span>
</div>
</div>
<div class="flex flex-col gap-stack-sm pt-stack-sm border-t-2 border-black">
<label class="font-label-bold text-label-bold uppercase">Method of Contact</label>
<div class="flex gap-stack-sm">
<label class="flex-1 cursor-pointer">
<input checked="" class="peer sr-only" name="method" type="radio" value="phone"/>
<div class="border-2 border-black p-stack-sm text-center font-label-bold text-label-bold uppercase peer-checked:bg-primary-container peer-checked:text-on-primary-container hover:bg-surface-container-high transition-colors btn-active">
<span class="material-symbols-outlined block mb-1" data-icon="phone">phone</span>
                                Phone
                            </div>
</label>
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="method" type="radio" value="in-person"/>
<div class="border-2 border-black p-stack-sm text-center font-label-bold text-label-bold uppercase peer-checked:bg-primary-container peer-checked:text-on-primary-container hover:bg-surface-container-high transition-colors btn-active">
<span class="material-symbols-outlined block mb-1" data-icon="person">person</span>
                                In-Person
                            </div>
</label>
</div>
</div>
</div>
<!-- Evidence & Decision Card -->
<div class="bg-surface-container border-2 border-black p-stack-md flex flex-col gap-stack-md">
<div class="flex flex-col gap-stack-sm flex-grow">
<label class="font-label-bold text-label-bold uppercase" for="evidence">Evidence / Notes</label>
<textarea class="w-full border-2 border-black bg-background p-stack-sm font-body-md focus:outline-none focus:ring-0 focus:border-black resize-none" id="evidence" placeholder="E.g., Customer called back at 14:30 and explicitly approved the brake pad replacement." rows="4"></textarea>
</div>
<div class="flex flex-col gap-stack-sm mt-auto pt-stack-md border-t-2 border-black">
<label class="font-label-bold text-label-bold uppercase">Decision Outcome</label>
<div class="flex gap-stack-sm">
<button class="flex-1 border-2 border-black bg-primary-container text-on-primary-container p-stack-sm font-label-bold text-label-bold uppercase hover:bg-primary transition-colors btn-active flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
                            Approved
                        </button>
<button class="flex-1 border-2 border-black bg-error-container text-on-error-container p-stack-sm font-label-bold text-label-bold uppercase hover:bg-error hover:text-on-error transition-colors btn-active flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined" data-icon="cancel">cancel</span>
                            Rejected
                        </button>
</div>
</div>
</div>
<!-- Submit Action -->
<div class="md:col-span-2 flex justify-end mt-stack-md">
<button class="w-full md:w-auto border-2 border-black bg-background text-on-background px-stack-lg py-stack-sm font-label-bold text-label-bold uppercase hover:bg-surface-container-high transition-colors btn-active" type="button">
                    Save Record
                 </button>
</div>
</form>
</main>
<!-- BottomNavBar (Mobile Only) - Suppressed for transactional intent logically, but JSON mandates it as an anchor. We will render it but note the task context usually implies suppression. Following JSON anchors. -->
<nav class="bg-background dark:bg-background text-primary dark:text-primary-fixed fixed bottom-0 w-full z-50 border-t-2 border-black dark:border-white flex justify-around items-stretch h-16 md:hidden">
<a class="flex flex-col items-center justify-center text-on-surface dark:text-on-surface w-full h-full hover:bg-surface-container dark:hover:bg-surface-container-high active:translate-y-0.5 transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
<span class="font-label-bold text-label-bold uppercase mt-1 text-[10px]">Home</span>
</a>
<!-- Assuming "Jobs" is active as we are recording a decision on a job -->
<a class="flex flex-col items-center justify-center bg-primary dark:bg-primary-fixed text-on-primary dark:text-on-primary-fixed w-full h-full active:translate-y-0.5 transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="build">build</span>
<span class="font-label-bold text-label-bold uppercase mt-1 text-[10px]">Jobs</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface dark:text-on-surface w-full h-full hover:bg-surface-container dark:hover:bg-surface-container-high active:translate-y-0.5 transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="font-label-bold text-label-bold uppercase mt-1 text-[10px]">Finance</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface dark:text-on-surface w-full h-full hover:bg-surface-container dark:hover:bg-surface-container-high active:translate-y-0.5 transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
<span class="font-label-bold text-label-bold uppercase mt-1 text-[10px]">More</span>
</a>
</nav>
</body></html>
