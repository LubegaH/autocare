<style>
        /* Base Neo-Brutalist Styles */
        body {
            background-color: #f9f9f9;
            color: #1a1c1c;
            -webkit-tap-highlight-color: transparent;
        }
        
        .neo-border {
            border: 2px solid #000000;
        }

        .neo-btn {
            border: 2px solid #000000;
            transition: transform 0.1s ease;
        }

        .neo-btn:active {
            transform: translateY(2px);
        }

        .neo-input {
            border: 2px solid #000000;
            background-color: #ffffff;
            border-radius: 0;
        }

        .neo-input:focus {
            outline: none;
            border-color: #000000;
            box-shadow: none;
        }

        /* Hide scrollbar for cleaner look if needed */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="font-body-md text-body-md min-h-screen flex flex-col pb-safe">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface border-b-2 border-black dark:border-outline flex justify-between items-center px-margin-mobile py-stack-md w-full sticky top-0 z-50">
<button aria-label="Back" class="flex items-center justify-center p-2 neo-btn bg-background text-on-surface hover:bg-surface-container">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<div class="font-headline-md text-headline-md font-black tracking-tighter text-primary dark:text-primary-fixed-dim uppercase text-center flex-1">
            RECORD PAYMENT
        </div>
<!-- Spacer to balance the back button -->
<div class="w-10"></div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-3xl mx-auto p-margin-mobile flex flex-col gap-stack-lg">
<!-- Amount Due Card -->
<div class="bg-surface-container neo-border p-stack-md flex flex-col gap-unit">
<h2 class="font-label-bold text-label-bold uppercase text-on-surface-variant">Amount Due</h2>
<div class="font-display-lg text-display-lg text-primary tracking-tight">
                UGX 135,000
            </div>
<p class="font-body-md text-body-md text-on-surface-variant mt-unit">Job #8492</p>
</div>
<!-- Payment Form -->
<form class="flex flex-col gap-stack-lg">
<!-- Amount Paid Input -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-bold text-label-bold uppercase text-on-surface" for="amountPaid">Amount Paid</label>
<div class="relative flex items-center">
<span class="absolute left-4 font-body-lg text-body-lg font-bold text-on-surface-variant">UGX</span>
<input class="neo-input w-full p-4 pl-16 font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg" id="amountPaid" name="amountPaid" required="" type="text" value="135,000"/>
</div>
</div>
<!-- Payment Method Selection -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-bold text-label-bold uppercase text-on-surface">Payment Method</label>
<div class="grid grid-cols-2 md:grid-cols-4 gap-gutter">
<!-- Cash -->
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="paymentMethod" type="radio" value="cash"/>
<div class="neo-border bg-background p-stack-md flex flex-col items-center justify-center gap-stack-sm peer-checked:bg-secondary-container peer-checked:text-on-secondary-container transition-colors neo-btn">
<span class="material-symbols-outlined text-[32px]">payments</span>
<span class="font-label-bold text-label-bold uppercase text-center">Cash</span>
</div>
</label>
<!-- MTN MoMo -->
<label class="cursor-pointer">
<input class="peer sr-only" name="paymentMethod" type="radio" value="momo"/>
<div class="neo-border bg-background p-stack-md flex flex-col items-center justify-center gap-stack-sm peer-checked:bg-[#ffcc00] peer-checked:text-[#000000] transition-colors neo-btn">
<span class="material-symbols-outlined text-[32px]">phone_iphone</span>
<span class="font-label-bold text-label-bold uppercase text-center">MTN MoMo</span>
</div>
</label>
<!-- Airtel Money -->
<label class="cursor-pointer">
<input class="peer sr-only" name="paymentMethod" type="radio" value="airtel"/>
<div class="neo-border bg-background p-stack-md flex flex-col items-center justify-center gap-stack-sm peer-checked:bg-[#ff0000] peer-checked:text-white transition-colors neo-btn">
<span class="material-symbols-outlined text-[32px]">sim_card</span>
<span class="font-label-bold text-label-bold uppercase text-center">Airtel Money</span>
</div>
</label>
<!-- Bank Transfer -->
<label class="cursor-pointer">
<input class="peer sr-only" name="paymentMethod" type="radio" value="bank"/>
<div class="neo-border bg-background p-stack-md flex flex-col items-center justify-center gap-stack-sm peer-checked:bg-primary-container peer-checked:text-on-primary-container transition-colors neo-btn">
<span class="material-symbols-outlined text-[32px]">account_balance</span>
<span class="font-label-bold text-label-bold uppercase text-center">Bank Transfer</span>
</div>
</label>
</div>
</div>
<!-- Payment Reference Input -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-bold text-label-bold uppercase text-on-surface" for="reference" id="reference-label">Payment Reference (Optional)</label>
<input class="neo-input w-full p-4 font-body-lg text-body-lg" id="reference" name="reference" placeholder="Txn ID, Receipt No, etc." type="text"/>
<p class="font-body-md text-body-md text-on-surface-variant text-sm mt-1">Required for Mobile Money and Bank Transfers.</p>
</div>
<!-- Actions Container -->
<div class="mt-stack-lg flex flex-col gap-stack-md">
<button class="neo-btn bg-primary-container text-on-primary-container p-4 w-full font-headline-md text-headline-md uppercase flex items-center justify-center gap-2" type="submit">
<span class="material-symbols-outlined">check_circle</span>
                    CONFIRM PAYMENT
                </button>
</div>
</form>
</main>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const paymentMethods = document.querySelectorAll('input[name="paymentMethod"]');
        const referenceInput = document.getElementById('reference');
        const referenceLabel = document.getElementById('reference-label');
        
        paymentMethods.forEach(method => {
            method.addEventListener('change', (e) => {
                if (e.target.value === 'cash') {
                    referenceInput.removeAttribute('required');
                    referenceLabel.textContent = 'Payment Reference (Optional)';
                } else {
                    referenceInput.setAttribute('required', 'required');
                    referenceLabel.textContent = 'Payment Reference (Required)';
                }
            });
        });
    });
</script>
</body></html>
