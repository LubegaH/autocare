<!-- Neo-Brutalist Progress Stepper -->

<div class="h-3 bg-primary border-2 border-border-black w-full"></div>

<textarea class="w-full min-h-[120px] p-4 border-2 border-border-black bg-surface-container-lowest focus:bg-surface focus:outline-none font-body-md text-body-md rounded-none resize-y placeholder:text-outline" placeholder="Note any visible damage, scratches, or current condition of the vehicle before work begins..."></textarea>
