# ~/.codex/config.toml — personal defaults (example; trim to taste).
# Repo-specific overrides go in .codex/config.toml in the project.
# Check current keys against https://developers.openai.com/codex/config-reference
# before adopting — config options change between releases.

# Reasoning: medium default; raise per-task for complex debugging or
# architecture work rather than globally.
model_reasoning_effort = "medium"

